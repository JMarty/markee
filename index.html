<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markee</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="titlebar">
      <div id="toolbar-left">
        <button id="btn-sidebar" class="icon-btn" data-i18n-title="title.sidebar">
          <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg>
        </button>
      </div>
      <div id="tabs" role="tablist"></div>
      <div id="toolbar">
        <button id="btn-menu" class="icon-btn" data-i18n-title="title.menu" aria-haspopup="menu">
          <svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
        </button>
      </div>
    </header>

    <div id="menu" role="menu" hidden>
      <button data-action="open"><span data-i18n="menu.open"></span><kbd>Ctrl+O</kbd></button>
      <button data-action="open-folder"><span data-i18n="menu.openFolder"></span><kbd>Ctrl+Shift+O</kbd></button>
      <div id="menu-recent"></div>
      <button data-action="reveal" data-needs-doc><span data-i18n="menu.reveal"></span></button>
      <button data-action="print" data-needs-doc><span data-i18n="menu.print"></span><kbd>Ctrl+P</kbd></button>
      <hr />
      <button data-action="toc"><span data-i18n="menu.toc"></span><kbd>Ctrl+B</kbd></button>
      <button data-action="files"><span data-i18n="menu.files"></span><kbd>Ctrl+Shift+E</kbd></button>
      <button data-action="wide"><span data-i18n="menu.wide"></span><kbd>Ctrl+Shift+W</kbd></button>
      <button data-action="restore"><span data-i18n="menu.restore"></span></button>
      <button data-action="autoreload"><span data-i18n="menu.autoReload"></span></button>
      <div class="menu-row">
        <span data-i18n="menu.theme"></span>
        <div class="seg">
          <button data-theme-set="system" data-i18n="menu.themeSystem"></button>
          <button data-theme-set="light" data-i18n="menu.themeLight"></button>
          <button data-theme-set="dark" data-i18n="menu.themeDark"></button>
        </div>
      </div>
      <div class="menu-row">
        <span data-i18n="menu.zoom"></span>
        <div class="seg">
          <button data-action="zoom-out" title="Ctrl+−">−</button>
          <button data-action="zoom-reset" id="zoom-label" title="Ctrl+0">100%</button>
          <button data-action="zoom-in" title="Ctrl++">+</button>
        </div>
      </div>
      <div class="menu-row">
        <span data-i18n="menu.language"></span>
        <div class="seg" id="lang-seg"></div>
      </div>
      <hr />
      <button data-action="help"><span data-i18n="menu.help"></span><kbd>F1</kbd></button>
      <button data-action="update"><span data-i18n="menu.update"></span></button>
      <button data-action="about"><span data-i18n="menu.about"></span></button>
    </div>

    <div id="findbar" hidden>
      <input id="find-input" type="text" data-i18n-ph="find.placeholder" spellcheck="false" />
      <span id="find-count"></span>
      <button id="find-prev" data-i18n-title="find.prev">↑</button>
      <button id="find-next" data-i18n-title="find.next">↓</button>
      <button id="find-close" data-i18n-title="find.close">✕</button>
    </div>

    <main id="main">
      <aside id="sidebar" hidden>
        <div class="seg sidebar-seg">
          <button data-pane="toc" data-i18n="pane.toc"></button>
          <button data-pane="files" data-i18n="pane.files"></button>
        </div>
        <nav id="toc"></nav>
        <div id="files" hidden>
          <div id="files-head">
            <span id="files-root" title=""></span>
            <button id="files-pick" class="icon-btn" data-i18n-title="title.pickFolder">
              <svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg>
            </button>
          </div>
          <div id="tree" role="tree"></div>
        </div>
      </aside>
      <div id="scroller">
        <div id="stale-bar" role="status" hidden>
          <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
          <span id="stale-text"></span>
          <button id="stale-reload" class="primary" data-i18n="stale.reload"></button>
          <button id="stale-auto" class="link-btn" data-i18n="stale.always"></button>
          <button id="stale-dismiss" class="icon-btn" data-i18n-title="stale.dismiss">✕</button>
        </div>
        <div id="docs"></div>
        <section id="welcome">
          <div class="hero">
            <img class="app-icon" alt="" width="56" height="56" />
            <div>
              <h1>Markee <span id="welcome-version"></span></h1>
              <p data-i18n="welcome.tagline"></p>
            </div>
          </div>

          <div class="actions">
            <button class="action" data-action="open">
              <svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z M9 2v3h3"/></svg>
              <span data-i18n="welcome.open"></span><kbd>Ctrl+O</kbd>
            </button>
            <button class="action" data-action="open-folder">
              <svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></svg>
              <span data-i18n="welcome.openFolder"></span><kbd>Ctrl+Shift+O</kbd>
            </button>
            <button class="action" data-action="help">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4M8 11.6v.1"/></svg>
              <span data-i18n="welcome.help"></span><kbd>F1</kbd>
            </button>
          </div>

          <div class="welcome-grid">
            <div class="panel">
              <div class="panel-head">
                <h2 data-i18n="welcome.recent"></h2>
                <button id="recent-clear" class="link-btn" data-i18n="welcome.clear"></button>
              </div>
              <ul id="recent"></ul>
              <p id="recent-empty" class="muted" data-i18n="welcome.noRecent"></p>
            </div>

            <div class="side">
              <div class="panel" id="default-card">
                <h2 data-i18n="welcome.defaultTitle"></h2>
                <p class="muted" data-i18n="welcome.defaultText"></p>
                <div class="row">
                  <button id="default-open" class="primary" data-i18n="welcome.defaultButton"></button>
                  <button id="default-dismiss" class="link-btn" data-i18n="welcome.dismiss"></button>
                </div>
              </div>
              <div class="panel">
                <h2 data-i18n="welcome.tip"></h2>
                <p id="tip" class="muted"></p>
              </div>
              <div class="panel">
                <h2 data-i18n="welcome.shortcuts"></h2>
                <dl class="shortcuts">
                  <dt><kbd>Ctrl</kbd>+<kbd>Tab</kbd></dt><dd data-i18n="sc.nextTab"></dd>
                  <dt><kbd>Ctrl</kbd>+<kbd>W</kbd></dt><dd data-i18n="sc.closeTab"></dd>
                  <dt><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd></dt><dd data-i18n="sc.reopen"></dd>
                  <dt><kbd>Ctrl</kbd>+<kbd>F</kbd></dt><dd data-i18n="sc.find"></dd>
                  <dt><kbd>Ctrl</kbd>+<kbd>B</kbd></dt><dd data-i18n="sc.sidebar"></dd>
                  <dt><kbd>Ctrl</kbd>+<kbd>+</kbd> / <kbd>−</kbd></dt><dd data-i18n="sc.zoom"></dd>
                  <dt><kbd>Alt</kbd>+<kbd>←</kbd></dt><dd data-i18n="sc.back"></dd>
                  <dt><kbd>Ctrl</kbd>+<kbd>P</kbd></dt><dd data-i18n="sc.print"></dd>
                </dl>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="update-bar" hidden>
      <span id="update-text"></span>
      <button id="update-go" class="primary" data-i18n="update.now"></button>
      <button id="update-later" data-i18n="update.later"></button>
    </div>

    <dialog id="about">
      <img class="app-icon" alt="" width="72" height="72" />
      <h2>Markee</h2>
      <p id="about-version"></p>
      <p data-i18n="about.tagline"></p>
      <p class="links">
        <a data-href="https://github.com/JMarty/markee">GitHub</a> ·
        <a data-href="https://github.com/JMarty/markee/issues" data-i18n="about.issues"></a> ·
        <a data-href="https://github.com/JMarty/markee/blob/main/LICENSE" data-i18n="about.license"></a>
      </p>
      <p class="small">© 2026 <a data-href="https://github.com/JMarty">JMarty</a></p>
      <form method="dialog"><button class="primary" data-i18n="about.close"></button></form>
    </dialog>

    <div id="toast" role="status" hidden></div>

    <div id="drop-overlay" hidden><div data-i18n="drop"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
