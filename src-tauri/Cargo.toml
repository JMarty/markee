[package]
name = "markee"
version = "0.3.0"
edition = "2021"

[lib]
name = "markee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
