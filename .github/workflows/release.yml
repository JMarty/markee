# Új verzió kiadása: a verziószám átírása után egy `v*` címke pusholása
# (pl. `git tag v0.2.0 && git push origin v0.2.0`) lefordítja, aláírja és
# GitHub Release-ként közzéteszi a telepítőt a frissítőhöz szükséges latest.json-nal.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Markee ${{ github.ref_name }}
          releaseBody: |
            Telepítés: töltsd le a `Markee_..._x64-setup.exe` fájlt és futtasd. A már telepített Markee magától felajánlja a frissítést.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
